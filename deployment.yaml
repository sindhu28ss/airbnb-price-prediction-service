apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-prediction-app
spec:
  replicas: 2  # Number of pods to run
  selector:
    matchLabels:
      app: price-prediction
  template:
    metadata:
      labels:
        app: price-prediction
    spec:
      containers:
      - name: price-prediction-container
        image: sindhu0405/price-prediction-app  # Replace with your Docker Hub image
        ports:
        - containerPort: 9696

